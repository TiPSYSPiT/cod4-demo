<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoD4 Demo Viewer</title>
  <meta name="description" content="Call of Duty 4 demo (.dm_1) viewer - parses the demo locally in the browser.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">CoD4</span> Demo Viewer</div>
    <div class="file-actions">
      <span id="file-name" class="file-name"></span>
      <label class="btn" title="Open a .dm_1 demo">
        <input type="file" id="file-input" accept=".dm_1,.DM_1" hidden>Open demo
      </label>
      <div class="export" id="export-wrap" hidden>
        <button class="btn" id="export-btn" title="Download DemoData as JSON">Export JSON</button>
        <label class="export-opt" title="Include the large per-player position arrays"><input type="checkbox" id="export-positions"> with positions</label>
      </div>
    </div>
  </header>

  <main id="app">
    <section id="dropzone" class="dropzone">
      <div class="dropzone-inner">
        <div class="drop-icon" aria-hidden="true"></div>
        <h1>Drop a CoD4 demo here</h1>
        <p>or <label class="link">choose a file<input type="file" id="file-input-2" accept=".dm_1,.DM_1" hidden></label> (<code>.dm_1</code>, stock CoD4 or CoD4X)</p>
        <p class="muted">The file is read locally in your browser. Nothing is uploaded.</p>
      </div>
    </section>

    <section id="progress" class="progress" hidden>
      <div class="progress-label" id="progress-label">Parsing…</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </section>

    <section id="error" class="banner banner-error" hidden></section>
    <section id="warnings" class="banners"></section>

    <section id="viewer" hidden>
      <div id="overview" class="overview"></div>
      <nav class="tabs" id="tabs" role="tablist">
        <button role="tab" data-tab="scoreboard" class="active">Scoreboard</button>
        <button role="tab" data-tab="rounds">Round by Round</button>
        <button role="tab" data-tab="kpr">Kills per Round</button>
        <button role="tab" data-tab="chat">Chat</button>
        <button role="tab" data-tab="console">Console</button>
        <button role="tab" data-tab="events">Events</button>
        <button role="tab" data-tab="map">Map</button>
      </nav>
      <div class="tab-panels">
        <section class="tab-panel active" id="tab-scoreboard"></section>
        <section class="tab-panel" id="tab-rounds"></section>
        <section class="tab-panel" id="tab-kpr"></section>
        <section class="tab-panel" id="tab-chat"></section>
        <section class="tab-panel" id="tab-console"></section>
        <section class="tab-panel" id="tab-events"></section>
        <section class="tab-panel" id="tab-map"></section>
      </div>
    </section>
  </main>

  <!-- parser / analysis (DOM-free, also run inside the worker) -->
  <script src="js/core/c4.js"></script>
  <script src="js/parser/tables.js"></script>
  <script src="js/parser/huffman.js"></script>
  <script src="js/parser/msg.js"></script>
  <script src="js/parser/delta.js"></script>
  <script src="js/parser/demo.js"></script>
  <script src="js/common/text.js"></script>
  <script src="js/common/constants.js"></script>
  <script src="js/common/servercmd.js"></script>
  <script src="js/common/names.js"></script>
  <script src="js/common/exportName.js"></script>
  <script src="js/analysis/weapons.js"></script>
  <script src="js/analysis/collect.js"></script>
  <script src="js/analysis/teams.js"></script>
  <script src="js/analysis/rounds.js"></script>
  <script src="js/analysis/events.js"></script>
  <script src="js/analysis/build.js"></script>
  <script src="js/analysis/worker.js"></script>
  <!-- map calibration (JS instead of JSON: fetch() is blocked on file://) -->
  <script src="assets/maps/maps.js"></script>
  <!-- user interface -->
  <script src="js/ui/dom.js"></script>
  <script src="js/ui/overview.js"></script>
  <script src="js/ui/scoreboard.js"></script>
  <script src="js/ui/rounds.js"></script>
  <script src="js/ui/killsPerRound.js"></script>
  <script src="js/ui/chat.js"></script>
  <script src="js/ui/console.js"></script>
  <script src="js/ui/events.js"></script>
  <script src="js/ui/map/config.js"></script>
  <script src="js/ui/map/renderer.js"></script>
  <script src="js/ui/map/heatmap.js"></script>
  <script src="js/ui/map/playback.js"></script>
  <script src="js/ui/map/mapTab.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
