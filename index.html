<meta charset="utf-8">
<title>CoD4 Demo Inspector</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">

<div class="wrap">
  <header>
    <a class="ghlink" href="https://github.com/TiPSYSPiT/cod4-demo" target="_blank"
       rel="noopener" title="Project page on GitHub" aria-label="Project page on GitHub">
      <svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .271.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
      </svg>
    </a>
    <p class="eyebrow">.dm_1 &middot; Call of Duty 4 / CoD4X</p>
    <h1>CoD4 Demo Inspector</h1>
    <p class="lede">Drop in a demo and it is decoded in your browser. You get teams, player stats, a round-by-round breakdown and the chat log.</p>
  </header>

  <div class="drop" id="drop">
    <div class="txt">
      <b>Drop a demo here</b> &ndash; or
      <button class="btn ghost" id="pick" type="button">choose a file</button>
      <div class="hint">Client demo from <span class="mono">main/demos</span> or <span class="mono">mods/&lt;mod&gt;/demos</span>, e.g. <span class="mono">demo0025.dm_1</span></div>
    </div>
    <input type="file" id="file" accept=".dm_1" hidden>
  </div>

  <div id="prog" hidden>
    <progress id="pbar" max="100" value="0"></progress>
    <div class="status" id="pmsg"></div>
  </div>
  <p class="err" id="error" hidden></p>

  <div id="out"></div>
</div>

<script src="js/netfields.js"></script>
<script src="js/snapshot.js"></script>
<script src="js/dm1.js"></script>
<script src="js/app.js"></script>
